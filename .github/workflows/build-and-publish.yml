name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ardontoonstra/donit-games

jobs:
  build:
    # Free *native* arm64 runners for public repos — no QEMU at all. This repo
    # is currently private, so these minutes are billed, not free; revisit
    # once the repo goes public (see docs/DEPLOYMENT.md's public-repo note).
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout games.donit
        uses: actions/checkout@v7

      # Public repo — no token/PAT needed to check it out.
      - name: Checkout undercover-game
        uses: actions/checkout@v7
        with:
          repository: ArdonToonstra/undercover-game
          path: undercover-game

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore & test games.donit
        run: dotnet test

      # Publishes the pass-and-play WASM app and stages it into this repo's
      # own build context — the same by-hand steps from Phase 5
      # (docs/IMPLEMENTATION-PLAN.md), just mechanized. wwwroot/undercover/ is
      # gitignored: it's a separate repo's dotnet publish output, not authored
      # here.
      - name: Publish pass-and-play WASM app
        run: |
          dotnet publish undercover-game/undercover-client/undercover-client.csproj \
            -c Release \
            -o publish/undercover

      - name: Rewrite base href for the /undercover/ mount
        run: sed -i 's#<base href="/" />#<base href="/undercover/" />#' publish/undercover/wwwroot/index.html

      - name: Stage the WASM bundle into src/DonitGames.Web/wwwroot/undercover
        run: |
          rm -rf src/DonitGames.Web/wwwroot/undercover
          mkdir -p src/DonitGames.Web/wwwroot/undercover
          cp -r publish/undercover/wwwroot/. src/DonitGames.Web/wwwroot/undercover/
          # Precompressed siblings are unused dead weight now — Program.cs
          # serves /undercover/** straight off disk, uncompressed, by design
          # (see its comment for why MapStaticAssets can't be trusted here).
          rm -f src/DonitGames.Web/wwwroot/undercover/_framework/*.br \
                src/DonitGames.Web/wwwroot/undercover/_framework/*.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
